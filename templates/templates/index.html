<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32 Control</title>
</head>
<body style="font-family:Arial;text-align:center;margin-top:40px;">

<h2>ESP32-S3 LED Control</h2>

<button onclick="send('on')">LED ON</button>
<button onclick="send('off')">LED OFF</button>

<br><br>

<button onclick="send('red')">RED</button>
<button onclick="send('green')">GREEN</button>
<button onclick="send('blue')">BLUE</button>

<script>
function send(cmd){
fetch("/command?value="+cmd)
.then(r=>r.json())
.then(d=>alert("Command: "+cmd));
}
</script>

</body>
</html>
